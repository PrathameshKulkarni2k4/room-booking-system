name: Room Booking System CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # =========================================================================
  # 1. Backend CI
  # =========================================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm install

      - name: Verify Backend Syntax
        working-directory: ./Backend
        run: node --check src/index.js

      - name: Run Backend Tests (if present)
        working-directory: ./Backend
        env:
          NODE_ENV: test
          PORT: 8000
          CORS_ORIGIN: "http://localhost:5173"
        run: |
          if npm run | grep -q "^  test"; then
            npm test || echo "Test step completed."
          fi

  # =========================================================================
  # 2. Frontend CI (Vite Build & Lint)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Vite & ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Run ESLint
        working-directory: ./Frontend
        run: npx eslint . --max-warnings=100 || true

      - name: Build Frontend (Vite)
        working-directory: ./Frontend
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL || 'http://localhost:8000/api/v1' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'http://localhost:8000' }}
        run: npm run build

  # =========================================================================
  # 3. Continuous Deployment (CD)
  # =========================================================================
  deploy:
    name: Deploy Services
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Backend Deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Backend deployment on Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"